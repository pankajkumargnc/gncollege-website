name: GNC Modern CI/CD Pipeline

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 🧪 Automated Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Execute Unit Tests
        run: npm test

  build-and-validate:
    name: 🏗️ Production Build & Verification
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Run Vite Production Build
        run: |
          export VITE_FIREBASE_API_KEY="${VITE_FIREBASE_API_KEY:-mock-key-for-ci-build}"
          export VITE_FIREBASE_AUTH_DOMAIN="${VITE_FIREBASE_AUTH_DOMAIN:-gnc-college-web.firebaseapp.com}"
          export VITE_FIREBASE_PROJECT_ID="${VITE_FIREBASE_PROJECT_ID:-gnc-college-web}"
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: 📤 Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist/
          retention-days: 7

  playwright-qa:
    name: 🧪 Automated Responsive & Zero-Overflow QA
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 🔍 Run Playwright 42-Check Responsive Matrix
        run: node scripts/runPlaywrightQA.js

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse-audit:
    name: ⚡ Lighthouse CI Performance & A11y Audit
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download Built Dist
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist/

      - name: ⚡ Run Lighthouse CI
        run: |
          npx -y @lhci/cli@0.14.x autorun || true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  firebase-preview:
    name: 🚀 Firebase Hosting Preview Channel (PR)
    if: github.event_name == 'pull_request'
    needs: [build-and-validate, playwright-qa]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Built Dist
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist/

      - name: 🚀 Deploy to Firebase Preview Channel
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GNC_COLLEGE_WEB }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GNC_COLLEGE_WEB }}'
          projectId: gnc-college-web
          channelId: 'pr-${{ github.event.pull_request.number }}'
