<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Guru Nanak College, Dhanbad</title>
  <script>
    // Single Page Apps for GitHub Pages & Static Hosts
    // Redirects deep links to index.html with route preserved in session/query
    var pathSegmentsToKeep = 0;
    var l = window.location;
    var base = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
    var path = l.pathname.slice(1);
    
    // Check if hosted under a subfolder or root
    var pathSegments = path.split('/');
    var targetPath = '/' + pathSegments.slice(pathSegmentsToKeep).join('/') + (l.search ? l.search : '') + l.hash;
    
    // Store requested path for React Router
    try {
      sessionStorage.setItem('gnc_spa_redirect', targetPath);
    } catch (e) {}

    // Redirect to root with query fallback
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
      encodeURIComponent(targetPath)
    );
  </script>
</head>
<body>
  <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #0B1F3A;">
    <h2>Routing to Guru Nanak College Digital Campus...</h2>
    <p>Please wait while we redirect you to your destination.</p>
  </div>
</body>
</html>
